[phases.setup]
# O bun do nixpkgs (1.3.0) não lê o bun.lock v2; instalado abaixo na versão do projeto.
nixPkgs = ["nodejs_22"]
aptPkgs = ["curl", "unzip"]

[phases.install]
# o shell de login do build não inclui /usr/local/bin no PATH
paths = ["/usr/local/bin", "/app/node_modules/.bin"]
cmds = [
  "curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s bun-v1.4.2",
  "bun install --frozen-lockfile",
]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bun run start"
