name: PR Preview

# Builda a imagem da PR e publica no GHCR como `pr-<número>`.
# O servidor puxa essa tag sozinho (cron `scripts/preview-sync.sh`) e sobe o
# preview em https://amazarashi-pr-<número>.infra.gui.dev.br
#
# Modelo "pull" de propósito: o servidor está atrás de NAT, então o CI não
# precisa (nem consegue) abrir SSH para dentro dele.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      IMAGE: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://amazarashi-pr-${{ github.event.pull_request.number }}.infra.gui.dev.br
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push da imagem do preview
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Comentar a URL do preview na PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          <!-- pr-preview -->
          ### Preview: ${PREVIEW_URL}

          \`${COMMIT_SHA:0:7}\` · [logs do build](${RUN_URL}) · o servidor puxa a imagem nova em até 2 min
          EOF
          )
          gh pr comment "${PR_NUMBER}" --body "${BODY}" --edit-last --create-if-none > /dev/null

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # O container e o router saem sozinhos no próximo ciclo do preview-sync.sh;
      # aqui só apagamos a tag `pr-<n>` do GHCR para não acumular imagem.
      - name: Remover tag do preview no GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          VERSION_ID="$(gh api --paginate "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq ".[] | select(.metadata.container.tags[]? == \"pr-${{ github.event.pull_request.number }}\") | .id" \
            | head -1 || true)"
          if [ -z "${VERSION_ID}" ]; then
            echo "tag pr-${{ github.event.pull_request.number }} já não existe"
            exit 0
          fi
          gh api --method DELETE "/users/${OWNER}/packages/container/${PACKAGE}/versions/${VERSION_ID}"
          echo "tag pr-${{ github.event.pull_request.number }} removida do GHCR"
